<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a12; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui * { pointer-events: auto; }
  /* touch devices: no page zoom, no text selection, no long-press callouts anywhere in the game */
  html.cci-touch, html.cci-touch body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* ═════════════════════════════════════════════════════════════════════════════
   LOADING SCREEN (#loading) — painted by this file alone, before a single module
   arrives. It is the title card's world at dusk, staged the same way so the
   hand-off is a crossfade: the logo sits where title.js puts its logo, the
   progress plate where the start pill will be, the credits at the bottom.
     sky · sun · clouds · sea + glints · island silhouettes · sprinkles
     .ld-top     the logo (same lettering as src/systems/ui/title.js)
     .ld-credit  "Original Game Concept by Daniel Lavitt"
     .ld-lower   one column to the bottom edge: the progress plate (the Sugarfin swims the bar),
                 a rotating tip, and .ld-prod "Produced by ChiLab + Claude" pinned at its foot
     .ld-score   something to do while it loads: every tap / click / key pops sprinkles (.ld-fx),
                 the Sugarfin hops (a tap ON her is a backflip) and this badge keeps count
   Every moving thing is a CSS transform/opacity animation, so it keeps going on
   the compositor while main.js builds a system and the main thread is busy.
   The bar is driven by window.__cciLoad (the inline script at the end of body). Before main.js's
   first call nothing is countable, so from the first frame it eases along on time alone (0 → ~12 %
   in 1.5 s, then ever slower toward ~27 %) and the imports pick up from wherever it got to.
   Contract kept with main.js: it adds .done → this fades out (0.7 s) over the
   title card, which is already up underneath, then removes itself.
   ═════════════════════════════════════════════════════════════════════════════ */
  @font-face { font-family: "CCI Load Display"; src: url("./loading/fonts/ld-display.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }
  @font-face { font-family: "CCI Load Body"; src: url("./loading/fonts/ld-body.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: fallback; }
  @font-face { font-family: "CCI Load Body"; src: url("./loading/fonts/ld-body-it.woff2") format("woff2"); font-weight: 800; font-style: italic; font-display: fallback; }

  #loading {
    --ink: #24122c; --ink2: #2f2748; --edge: #2b2442; --panel: #fffaf1; --panel2: #ffeedb;
    --pink: #ef4f84; --pinkd: #cf2963; --gold: #ffc94a; --cream: #fff4e6;
    --fd: "CCI Load Display", "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --fb: "CCI Load Body", "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --tf: clamp(34px, min(14vw, 13.5vh), 150px);   /* the title's letter size (style.js --tf) */
    --zt: 2.5vh;        /* logo zone top … */
    --zh: 50vh;         /* … and height (the title's sky zone) */
    --hz: 61vh;         /* the sea horizon */
    --lower: 67.5vh;    /* progress plate top */
    --isle: clamp(230px, 34vw, 560px);
    position: fixed; inset: 0; z-index: 10; overflow: hidden; color: var(--cream);
    font: 800 16px/1.3 var(--fb); text-align: center; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
  }
  /* THE HAND-OFF. main.js adds .done with the title card already up underneath, and title.js starts its own
     identical logo ALREADY ASSEMBLED in the same place (it sees .ld-top and skips its entrance). So the whole
     screen dissolves (0.7 s) straight into the live islands; the logo leads by a beat and is gone by 0.72 s,
     then the script removes #loading on that transitionend (fallback timer 2.5 s).
     What the title card has no twin for (the progress plate, the tip, the credit pill, the pop counter)
     leaves first, in 0.36 s, so nothing of ours is left floating over the new screen while the sky and
     the logo dissolve.
     .ld-gone (touch.js's 'turn your phone' card is up instead of the title, there is no title at all, or a
     key/tap lands during the hand-off) takes the WHOLE screen away in 0.24 s, on the root's own opacity:
     a fresh transition (CSS never retimes one already running on the children), so it works whenever it
     lands, even mid-fade. */
  #loading.done { pointer-events: none; }
  #loading.done > * { opacity: 0; transition: opacity .7s cubic-bezier(.4, 0, .3, 1); }
  #loading.done > .ld-lower, #loading.done > .ld-credit, #loading.done > .ld-score, #loading.done > .ld-fx { transition-duration: .36s; }
  #loading.done > .ld-top { transition: opacity .6s cubic-bezier(.4, 0, .3, 1) .12s; }
  #loading.ld-gone { opacity: 0; transition: opacity .24s ease; }
  #loading.ld-gone .ld-block { opacity: 0; transition: opacity .22s ease; }
  #loading * { box-sizing: border-box; }
  :where(#loading) svg { display: block; width: 100%; height: 100%; overflow: visible; }
  :where(#loading) p { margin: 0; }
  /* renders (?shot=1) never see this screen: keep it still so it costs the harness nothing */
  #loading.ld-shot, #loading.ld-shot * { animation: none !important; transition: none !important; }
  .ld-abs { position: absolute; }
  .ld-srt { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── the world ─────────────────────────────────────────────────────────── */
  .ld-sky { position: absolute; inset: 0; background:
      radial-gradient(ellipse 70vw 34vh at 50% var(--hz), rgba(255,226,170,.75) 0%, rgba(255,196,160,.35) 38%, rgba(255,180,170,0) 72%),
      linear-gradient(180deg, #8791d4 0%, #9a98db 16%, #b69ddc 30%, #d9a2d2 42%, #f2a9c2 50%, #ffbba6 57%, #ffd0a4 var(--hz), #ffd0a4 100%); }
  .ld-sun { position: absolute; left: 50%; top: var(--hz); width: min(15vh, 22vw); height: min(15vh, 22vw); margin: calc(min(15vh, 22vw) / -2) 0 0 calc(min(15vh, 22vw) / -2);
    border-radius: 50%; background: radial-gradient(circle at 50% 50%, #fff7dc 0%, #ffe7b4 52%, #ffd08e 70%, rgba(255,200,140,0) 72%);
    box-shadow: 0 0 60px 26px rgba(255,214,160,.45); }
  .ld-cloud { position: absolute; height: auto; aspect-ratio: 200 / 92; will-change: transform; animation: ld-drift 46s ease-in-out infinite alternate; }
  .ld-cloud.c1 { left: -5vw; top: 5vh; width: min(30vw, 44vh); animation-duration: 52s; }
  .ld-cloud.c2 { right: -3vw; top: 22vh; width: min(20vw, 30vh); animation-duration: 41s; animation-delay: -12s; animation-direction: alternate-reverse; }
  .ld-cloud.c3 { left: 12vw; top: 40vh; width: min(11vw, 16vh); animation-duration: 37s; animation-delay: -20s; opacity: .85; }
  .ld-cloud.c4 { right: 17vw; top: 4vh; width: min(9vw, 13vh); animation-duration: 33s; opacity: .7; }
  @keyframes ld-drift { from { transform: translate3d(-2.5vw, 0, 0); } to { transform: translate3d(2.5vw, 0, 0); } }
  .ld-sea { position: absolute; left: 0; right: 0; top: var(--hz); bottom: 0; background:
      radial-gradient(ellipse min(18vw, 22vh) 34vh at 50% 0%, rgba(255,222,176,.55) 0%, rgba(255,200,170,.18) 55%, rgba(255,190,170,0) 100%),
      linear-gradient(180deg, #f0b3b4 0%, #cf97b2 7%, #a57fae 22%, #7a5f98 45%, #54406f 72%, #3a2a50 100%); }
  .ld-sea::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,236,206,.8); }
  .ld-glints { position: absolute; left: 50%; top: var(--hz); width: 0; height: 0; }
  .ld-glints i { position: absolute; height: 3px; border-radius: 3px; background: #fff1d6; opacity: .2; animation: ld-glint 3.2s ease-in-out infinite; }
  @keyframes ld-glint { 0%, 100% { opacity: .12; transform: scaleX(.55); } 50% { opacity: .85; transform: scaleX(1.15); } }
  .ld-isle { position: absolute; top: calc(var(--hz) - var(--isle) * .2667); width: var(--isle); height: calc(var(--isle) * .2667);
    filter: drop-shadow(0 -1.5px 0 rgba(255,222,190,.9));
    -webkit-box-reflect: below 0 linear-gradient(transparent 35%, rgba(255,255,255,.22)); }
  .ld-isle.l { left: 0; }
  .ld-isle.r { right: 0; }
  .ld-lamp { animation: ld-lamp 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  .ld-beam { animation: ld-beam 2.6s ease-in-out infinite; }
  @keyframes ld-lamp { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes ld-beam { 0%, 100% { opacity: 0; } 50% { opacity: .55; } }
  .ld-sprinkles { position: absolute; inset: 0; overflow: hidden; }
  .ld-sprinkles i { position: absolute; top: 0; width: 5px; height: 11px; animation: ld-fall 13s linear infinite; will-change: transform; }
  .ld-sprinkles i b { display: block; width: 100%; height: 100%; border-radius: 99px; border: 1.2px solid rgba(36,18,44,.5);
    box-shadow: inset 0 1.2px 0 rgba(255,255,255,.55); animation: ld-twirl 3.4s ease-in-out infinite alternate; }
  .ld-sprinkles i.o { width: 7px; height: 7px; }
  .ld-sprinkles i.f { opacity: .6; transform: scale(.7); }
  @keyframes ld-fall { from { transform: translate3d(0, -4vh, 0); } to { transform: translate3d(0, 104vh, 0); } }
  @keyframes ld-twirl { from { transform: translateX(-9px) rotate(-50deg); } to { transform: translateX(9px) rotate(70deg); } }

  /* ── the logo (lettering mirrors title.js / style.js; self-contained) ──── */
  .ld-top { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + var(--zt)); height: var(--zh);
    display: flex; align-items: center; justify-content: center; padding: 0 12px; }
  .ld-block { display: flex; flex-direction: column; align-items: center; transform-origin: 50% 50%; }
  .ld-logo { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 .46em; font-size: var(--tf); line-height: .9; }
  /* The ribbon is logo lettering, sized exactly as the title's .cci-ti-eyebrow (style.js) so the two logos
     register at the hand-off. On a phone held upright it comes out ~12.8 px: bold, caps, letter-spaced, cream
     on a dark-outlined pink ribbon. It is exempt from the 14 px text floor; if the title ever floors its
     eyebrow (max(.235em, 14px)), change this line to match or the crossfade will show two ribbons. */
  .ld-eyebrow { position: relative; z-index: 3; font-size: .235em; margin-bottom: .1em; animation: ld-pop .45s cubic-bezier(.3,1.7,.5,1) .12s both; }
  .ld-rib { position: relative; display: inline-block; padding: .26em .95em .2em; transform: rotate(-3deg);
    font: 800 1em/1 var(--fd); letter-spacing: .17em; color: #fff8ee; white-space: nowrap;
    background: linear-gradient(180deg, #ff86ae 0%, var(--pink) 58%, #d7386f 100%);
    border: .11em solid var(--ink); border-radius: .32em;
    box-shadow: 0 .15em 0 var(--ink), 0 .34em .6em rgba(16,4,24,.4), inset 0 .09em 0 rgba(255,255,255,.5);
    text-shadow: 0 .09em 0 rgba(36,18,44,.6); }
  .ld-rib::before, .ld-rib::after { content: ''; position: absolute; top: .42em; bottom: -.42em; width: 1.1em; z-index: -1;
    background: linear-gradient(180deg, #c8336a, #a8285a); border: .11em solid var(--ink); }
  .ld-rib::before { left: -.78em; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%); }
  .ld-rib::after { right: -.78em; clip-path: polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%); }
  .ld-word { position: relative; display: flex; align-items: flex-end; justify-content: center; white-space: nowrap;
    font: 800 1em/.94 var(--fd); letter-spacing: -.01em; }
  /* the ink drop-shadow sits on a STATIC wrapper per letter (and on the ornaments), never on a parent of
     something animated: WebKit clips animated children of a filtered element to its box */
  .ld-lf, .ld-ears svg, .ld-tail svg, .ld-lolw svg { filter: drop-shadow(0 .06em 0 var(--ink)) drop-shadow(0 .15em .16em rgba(16,4,24,.5)); }
  .ld-lf { position: relative; display: block; }
  .ld-l { position: relative; display: inline-block; animation: ld-drop .55s cubic-bezier(.3,1.55,.5,1) both; animation-delay: calc(.2s + var(--i) * .05s); }
  .ld-li { position: relative; display: block; transform-origin: 50% 85%; }
  .ld-l b { display: block; font: inherit; }
  .ld-l .o { position: absolute; left: 0; top: 0; color: var(--ink); -webkit-text-stroke: .17em var(--ink); }
  .ld-l .f { position: relative; color: transparent; -webkit-background-clip: text; background-clip: text; }
  .ld-l.cd .ld-li { animation: ld-bobA 2.7s ease-in-out infinite; animation-delay: calc(var(--i) * -.29s); }
  .ld-l.cd:nth-child(odd) .ld-li { animation-name: ld-bobB; }
  .ld-l.cd .f { background-image:
      linear-gradient(180deg, rgba(255,255,255,.66) 0%, rgba(255,255,255,.14) 30%, rgba(255,255,255,0) 44%),
      linear-gradient(0deg, rgba(90,10,50,.32) 0%, rgba(90,10,50,0) 30%),
      repeating-linear-gradient(126deg, var(--c) 0 .09em, #fff6ec .09em .18em); }
  .ld-cat { font-size: .8em; margin-top: .02em; }
  .ld-l.ct { animation-name: ld-rise; animation-delay: calc(.8s + var(--i) * .04s); }
  .ld-l.ct .ld-li { transform-origin: 50% 100%; animation: ld-breath 5s ease-in-out infinite; animation-delay: calc(var(--i) * -.22s); }
  .ld-l.ct .f { background-image:
      linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.1) 34%, rgba(255,255,255,0) 46%),
      linear-gradient(180deg, #e6fff6 0%, #a2f0d7 40%, #52c7a8 72%, #2fa88c 100%); }
  .ld-sp { display: inline-block; width: .24em; }
  .ld-ears { position: absolute; left: .01em; top: -.25em; width: .7em; height: .5em; transform-origin: 25% 100%; animation: ld-flick 3.7s ease-in-out infinite; }
  .ld-tail { position: absolute; right: -.42em; bottom: .08em; width: .5em; height: .7em; transform-origin: 8% 92%; animation: ld-sway 3.9s ease-in-out infinite alternate; }
  .ld-lolli { position: absolute; left: -.34em; top: -.36em; width: .6em; height: 1.04em; animation: ld-pop .5s cubic-bezier(.3,1.6,.5,1) .35s both; }
  .ld-lolw { display: block; width: 100%; height: 100%; transform-origin: 50% 90%; animation: ld-lolli 4.8s ease-in-out infinite alternate; }
  .ld-and { position: relative; z-index: 2; display: flex; align-items: center; gap: .18em; margin: .06em 0 .02em; font-size: .27em; animation: ld-pop .45s cubic-bezier(.3,1.7,.5,1) .62s both; }
  .ld-andb { font: 800 1em/1 var(--fd); letter-spacing: .1em; color: var(--ink); padding: .2em .55em .14em .65em; border-radius: 999px;
    background: linear-gradient(180deg, #ffeab0, var(--gold) 70%, #f0ab2c); border: .1em solid var(--ink);
    box-shadow: 0 .12em 0 var(--ink), 0 .26em .5em rgba(16,4,24,.4), inset 0 .07em 0 rgba(255,255,255,.75);
    animation: ld-andw 5.6s ease-in-out infinite alternate; }
  .ld-and .st { width: .85em; height: .85em; filter: drop-shadow(0 .07em 0 var(--ink)); }
  .ld-spark { position: absolute; width: .19em; height: .19em; color: #fff6d6; filter: drop-shadow(0 0 .05em rgba(255,214,130,.95)); animation: ld-twinkle 1.9s ease-in-out infinite; }
  .ld-spark.s1 { right: .18em; top: .2em; }
  .ld-spark.s2 { left: .08em; top: 1.5em; width: .14em; height: .14em; animation-delay: -.7s; }
  .ld-spark.s3 { right: .52em; bottom: .7em; width: .13em; height: .13em; animation-delay: -1.3s; }
  @keyframes ld-drop { 0% { opacity: 0; transform: translateY(-1.1em); } 40% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes ld-rise { 0% { opacity: 0; transform: translateY(.9em); } 40% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes ld-pop { 0% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes ld-bobA { 0%, 100% { transform: translateY(.03em) rotate(-4.6deg); } 50% { transform: translateY(-.04em) rotate(-1.4deg); } }
  @keyframes ld-bobB { 0%, 100% { transform: translateY(.03em) rotate(4.6deg); } 50% { transform: translateY(-.04em) rotate(1.4deg); } }
  @keyframes ld-breath { 0%, 100% { transform: translateY(.018em); } 50% { transform: translateY(-.018em); } }
  @keyframes ld-flick { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-10deg); } 94% { transform: rotate(2deg); } }
  @keyframes ld-sway { from { transform: rotate(-7deg); } to { transform: rotate(15deg); } }
  @keyframes ld-lolli { from { transform: rotate(-29deg); } to { transform: rotate(-19deg); } }
  @keyframes ld-andw { from { transform: rotate(-5.5deg); } to { transform: rotate(-2.5deg); } }
  @keyframes ld-twinkle { 0%, 55%, 100% { transform: scale(0) rotate(0); } 20% { transform: scale(1.1) rotate(45deg); } }

  /* ── credit ────────────────────────────────────────────────────────────── */
  .ld-credit { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + var(--zt) + var(--zh) / 2 + var(--tf) * 1.3 + 8px);
    display: flex; justify-content: center; padding: 0 16px; animation: ld-up .5s ease-out .25s backwards; }
  .ld-cplate { display: inline-flex; align-items: center; gap: .55em; max-width: 100%; padding: .42em 1.05em .46em;
    font: 800 clamp(15px, calc(.7vw + 9px), 21px)/1.2 var(--fb); color: var(--ink2); letter-spacing: .01em;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%); border: 3px solid var(--edge); border-radius: 999px;
    box-shadow: 0 4px 0 var(--edge), 0 12px 26px rgba(30,10,40,.38), inset 0 2px 0 rgba(255,255,255,.95), inset 0 -3px 0 rgba(196,156,128,.26); }
  .ld-cplate b { font: 800 1.2em/1 var(--fd); color: var(--pinkd); letter-spacing: .01em; white-space: nowrap; position: relative; top: .06em; }
  .ld-cplate .st { flex: none; width: 1.05em; height: 1.05em; filter: drop-shadow(0 1.5px 0 var(--ink)); }
  @keyframes ld-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ── the progress plate: caption · % · the bar the Sugarfin swims ─────── */
  /* one column from the plate's slot to the bottom edge: plate, tip, then the producer credit pinned to the
     bottom (margin-top: auto), so the tip can never print over it. fitLower() (script) pulls the column up
     on short windows and lets only the tips that fit be shown. */
  .ld-lower { position: absolute; left: 0; right: 0; top: var(--lower); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; align-items: center; padding: 0 16px;
    animation: ld-up .5s ease-out .4s backwards; }

  <script>
  // ── LOADING SCREEN driver (classic script: no module needed, runs before first paint) ──
  // main.js calls window.__cciLoad(stage, done, total, label) with stage
  // 'import' | 'create' | 'warmup' | 'ready' (a frame is yielded between creates).
  // The bar only ever moves forward. Between calls it CREEPS on its own: each
  // call aims it most of the way to the end of the step now running, with a CSS
  // transition as long as that step is expected to take (scaled by how fast this
  // device has been so far), so it keeps moving on the compositor while the main
  // thread is busy building. The % shows the start of the running step (honest).
  // Before the first call (the module download: 3-10 s on a slow link) nothing is
  // countable, so the bar eases along on time alone from the first frame and the
  // imports carry on from wherever it got to: it is never a flat 0 %.
  (function () {
    var root = document.getElementById('loading');
    if (!root) return;
    var q = function (s) { return root.querySelector(s); };
    var fillO = q('.ld-fillo'), fillI = q('.ld-filli'), rider = q('.ld-rider'), capEl = q('.ld-cap'), capT = q('.ld-cap span'),
      pctEl = q('.ld-pct'), track = q('.ld-track'), tipT = q('.ld-tip-t'), tipW = q('.ld-tipw'), sr = q('[role=status]'), block = q('.ld-block'), top = q('.ld-top'), credit = q('.ld-credit'),
      lower = q('.ld-lower'), plate = q('.ld-plate'), tipP = q('.ld-tip'), prod = q('.ld-prod'),
      whale = q('.ld-whale'), wb = q('.ld-wb'), fx = q('.ld-fx'), scoreEl = q('.ld-score'), scoreT = q('.ld-score-t');
    var SHOT = false; try { SHOT = new URLSearchParams(location.search).get('shot') === '1'; } catch (e) {}
    var TOUCH = document.documentElement.classList.contains('cci-touch');
    var TITLE = document.title;
    if (SHOT) root.classList.add('ld-shot');

    // one line per system in main.js's SYSTEM_FILES (unknown names get GENERIC)
    var LINES = {
      sky: 'hanging the sunset…', planes: 'launching the biplane…', terrain: 'pulling two islands out of the sea…',
      candyVegetation: 'planting the gummy forest…', candyArchitecture: 'frosting the Candy Palace…',
      candyCreatures: 'herding the jellybean beetles…', sourPatch: 'waking the Sour Patch Kids (uh-oh)…',
      catArchitecture: 'building Main Street (and the boulangerie)…', catNature: 'planting the catnip commons…',
      catCitizens: 'teaching the cats to say no…', catContainment: 'pointing every EXIT sign in a circle…',
      ferry: 'feeding the Sugarfin…', escape: 'digging the cave home…', touch: 'warming up your thumbs…',
      player: 'ironing your holiday shirt…', camera: 'wiping the camera lens…', particles: 'counting the sprinkles…',
      inventory: 'emptying your pockets…', weapons: 'hiding the Caramelizer…', powerups: 'polishing the stars…',
      interaction: 'oiling the door hinges…', story: 'writing the postcards home…', ui: 'painting the signposts…',
      intro: 'rehearsing the grand tour…', audio: 'tuning the ukulele…', warmup: 'warming the shaders…', ready: 'the ferry is boarding'
    };
    var GENERIC = ['tidying up the islands…', 'sweeping the pier…', 'fluffing the clouds…'];
    var DOWNLOAD = 'packing your suitcase…', IMPORT = 'unpacking the islands…';
    // the download phase, on time alone: [ms from its start, caption]
    var DL_LINES = [[2400, 'folding the beach towels…'], [4800, 'finding your sunglasses…'], [7600, 'checking the ferry timetable…'],
      [11000, 'still packing (it is a big suitcase)…'], [16000, 'sitting on the suitcase to close it…']];
    // and where the bar is meanwhile, by the wall clock: two easing-out terms, ~2 % at 0.2 s, 11 % at 1.5 s,
    // 13 % at 2 s, 17 % at 5 s, 21 % at 10 s, 25 % at 20 s, never past 27 %
