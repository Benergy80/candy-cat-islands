<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover lets the game run under the notch; the HUD pads itself with env(safe-area-inset-*).
     user-scalable=no + touch-action:none (below) keep pinch/double-tap from zooming the page instead of the camera. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f1a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Candy &amp; Cat" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="Escape from Candyland and Cat Island — a little 3D holiday on two very strange islands, and the long way home. Plays on desktop and on phones." />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<title>Escape from Candyland and Cat Island</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a12; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui * { pointer-events: auto; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; background: #0b0a12; z-index: 10; transition: opacity .6s;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); text-align: center; }
  #loading.done { opacity: 0; pointer-events: none; }
  /* touch devices: no page zoom, no text selection, no long-press callouts anywhere in the game */
  html.cci-touch, html.cci-touch body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
<script>
  // Early touch detection (src/systems/touch.js does the real work once the game loads):
  // flag the page before the first paint so there is no flash of the keyboard HUD.
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('touch');
      var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
      if (q === '1' || (q !== '0' && coarse)) document.documentElement.classList.add('cci-touch');
    } catch (e) {}
  })();
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="loading">baking the islands…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
